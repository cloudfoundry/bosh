name: Run Specs
on: [push, pull_request]
permissions:
  contents: read

jobs:
  unit_specs:
    strategy:
      fail-fast: false
      matrix:
        sub_project:
        - common:parallel
        - monitor:parallel
        - nats_sync:parallel
        - release:parallel
        - integration_support:parallel
        # ubuntu-24.04-arm runs the same specs natively on arm64.
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    name: unit_specs (${{ matrix.sub_project }}${{ matrix.runner == 'ubuntu-24.04-arm' && ', arm64' || '' }})
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v7
      with: { lfs: true}
    - uses: ruby/setup-ruby@v1
      with: { working-directory: src/ }
    - run: bundle install
      working-directory: src/
    - run: bundle exec rake spec:unit:${{matrix.sub_project}}
      working-directory: src/

  unit_specs-director:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        db:
        - mysql
        - postgresql
    steps:
    - uses: actions/checkout@v7
      with: { lfs: true}
    - uses: ruby/setup-ruby@v1
      with: { working-directory: src/ }

    - if: ${{ matrix.db == 'mysql' }}
      run: |
        sudo systemctl start mysql.service
        mysql --user=root --password=root -e "CREATE USER '$(whoami)'@'localhost' IDENTIFIED BY '$(whoami)';"
        mysql --user=root --password=root -e "GRANT ALL PRIVILEGES ON *.* TO '$(whoami)'@'localhost';"

    - if: ${{ matrix.db == 'postgresql' }}
      run: |
        sudo systemctl start postgresql.service
        sudo -u postgres createuser --superuser $(whoami)
        sudo -u postgres psql --command "alter user $(whoami) with encrypted password '$(whoami)'"

    - run: bundle
      working-directory: src/
    - run: DB=${{matrix.db}} DB_USER=$(whoami) DB_PASSWORD=$(whoami) bundle exec rake spec:unit:director:parallel
      working-directory: src/
