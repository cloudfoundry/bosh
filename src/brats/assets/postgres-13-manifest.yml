---
name: ((deployment-name))
instance_groups:
- name: bosh
  azs: [z1]
  instances: 1
  jobs:
  - name: postgres-13
    release: bosh
  - name: bpm
    release: bpm
  vm_type: default
  stemcell: default
  persistent_disk_type: default
  networks:
  - name: default
  properties:
    postgres:
      user: postgres
      password: c1oudc0w
      database: bosh

stemcells:
- alias: default
  os: ((stemcell-os))
  version: latest

releases:
- name: "bosh"
  version: "283.1.4"
  url: "https://bosh.io/d/github.com/cloudfoundry/bosh?v=283.1.4"
  sha1: "sha256:90ff361c730572b5beb275555f0f536c7d739ce94c946616e49bffc895cc3dc8"
- name: bpm
  version: latest

update:
  canaries: 1
  max_in_flight: 10
  canary_watch_time: 1000-30000
  update_watch_time: 1000-30000
